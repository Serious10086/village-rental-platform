# ============================================================================
#  Nginx 站点配置(容器内路径 /etc/nginx/conf.d/default.conf)
#
#  它干三件事:
#    1. 托管前端编译产物
#    2. 把 /api 反代到后端容器
#    3. 把 /upload 反代到后端容器(用户上传的图片)
#
#  【为什么 2 和 3 必须由 Nginx 转发,而不是前端直接写后端地址】
#  开发期靠 Vite 的 proxy 做这件事(见 frontend/vite.config.js),生产期
#  换成 Nginx —— **前端代码一个字都不用改**,因为 axios 的 baseURL 从头到尾
#  都是相对的 '/api'。反过来,如果前端写死 http://后端IP:8080/api,
#  就要处理跨域、就要把后端端口暴露到公网、换台机器就要重新打包。
#  同源 + 反代把这三个问题一起消掉了。
# ============================================================================

# 【把"浏览器用的是哪个端口"算出来】
# 后端要靠 X-Forwarded-Port 才能判断请求是不是同源。这里的坑在于:
# Nginx 容器内部监听的是 80,而宿主机把它映射成了 8088(见 compose 的
# WEB_PORT),浏览器发来的 Origin 写的是 8088。$server_port 在容器里
# 永远是 80,直接用会让后端算出 80 ≠ 8088,又变回跨域。
#
# 真正带着用户端口的是 $http_host(形如 localhost:8088),所以从它尾部
# 把端口抠出来。没有端口(直接用 80 访问)时退回 $server_port。
map $http_host $client_port {
    ~:(\d+)$  $1;
    default   $server_port;
}

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 上传接口最大 10MB(后端 application.yml 里 max-file-size),
    # 请求体上限给到 50MB 和那边保持一致。Nginx 默认只有 1MB,
    # 不改的话传图片会得到一个 413 —— 而且前端拿不到后端的错误信息,
    # 看起来像是"上传按钮没反应"。
    client_max_body_size 50m;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    # 只压文本类。图片/字体本来就是压缩格式,再压一遍是白费 CPU
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # ── 前端静态文件 ────────────────────────────────────────────
    location / {
        # 【history 模式必须要有这一句】
        # 前端路由用的是 createWebHistory(vue-router),URL 长这样:
        #     /resource/12   /order/5   /admin/stat/village
        # 这些路径在服务器上**没有对应的文件** —— 它们只是前端路由。
        # 用户在这一页按 F5,浏览器会真的去请求 /resource/12,
        # 没有这句就是 404。try_files 的意思是:先找同名文件,找不到就
        # 交回 index.html,让前端路由自己解析。
        # (开发期不会遇到这个问题:Vite 的 dev server 默认就带这个回落。
        #  所以"开发时好好的、部署后一刷新就 404"是个经典现象。)
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的编译产物可以长期缓存 —— 内容变了文件名就变了,
    # 不存在"缓存里是旧版本"的问题
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不能缓存:它是入口,它被缓存住的话用户永远拿不到新版
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── 后端接口 ────────────────────────────────────────────────
    location /api/ {
        # 注意结尾没有路径:proxy_pass http://backend:8080; 会把
        # 原始 URI 原样带过去(/api/xxx 还是 /api/xxx)。
        # 写成 http://backend:8080/ 就会把 /api 前缀截掉,后端全部 404。
        proxy_pass http://backend:8080;

        # 【这四个头不是可选的】
        # 后端配了 server.forward-headers-strategy=framework,靠它们还原
        # 请求的真实来源。少了 X-Forwarded-Port 的话,后端会以为请求来自
        # 它自己的 8080,于是**把同源的登录请求当成跨域,返回 403** ——
        # 表现是首页能开但一登录就失败。详见 application.yml 那段注释。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $client_port;

        # AI 问答那条链路后端自己设了 10 秒读超时,失败后走降级。
        # 这里给到 120 秒是留足余量:Nginx 先超时的话,用户看到的是
        # 502,而不是后端那句"AI 暂时不可用,以下是常见问题解答" ——
        # 降级话术就白写了。
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # ── 上传的图片 ──────────────────────────────────────────────
    location /upload/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $client_port;

        # 图片内容不会变(文件名唯一),可以放心长缓存
        expires 7d;
        add_header Cache-Control "public";
    }
}
