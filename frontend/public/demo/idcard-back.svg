<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <!-- 身份证国徽面示意图(演示数据用,非真实证件) -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="480" height="300" fill="url(#bg2)"/>
  <rect x="8" y="8" width="464" height="284" rx="14" fill="none"
        stroke="#93c5fd" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- 国徽(简化) -->
  <circle cx="240" cy="96" r="42" fill="#dc2626" fill-opacity="0.85"/>
  <circle cx="240" cy="96" r="32" fill="none" stroke="#fef2f2" stroke-width="2"/>
  <path d="M240 78 L248 96 L266 98 L252 110 L256 128 L240 118 L224 128 L228 110 L214 98 L232 96 Z"
        fill="#fef2f2"/>
  <text x="240" y="152" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="14" fill="#64748b" font-weight="600">中华人民共和国</text>
  <text x="240" y="174" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="13" fill="#94a3b8">居民身份证</text>

  <!-- 签发机关 / 有效期限 -->
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#94a3b8">
    <text x="72" y="224">签发机关</text>
    <text x="72" y="252">有效期限</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round">
    <line x1="140" y1="220" x2="384" y2="220"/>
    <line x1="140" y1="248" x2="384" y2="248"/>
  </g>

  <text x="240" y="278" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif"
        font-size="11" fill="#93c5fd">示例 · 非真实证件</text>
</svg>
